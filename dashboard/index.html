<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo de Temperaturas - Quantum Labs</title>
<link rel="icon" type="image/png" href="assets/img/icono-naranja.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="encabezado">
    <div class="encabezado__marca">
        <img id="logo" class="encabezado__logo" src="assets/img/logo-horizontal-naranja.png" alt="Quantum Labs">
    </div>
    <h1 class="encabezado__titulo">Server Temperature Monitor</h1>
    <div class="encabezado__controles">
        <button id="boton-tema" class="boton-tema" title="Cambiar tema" aria-label="Cambiar tema">
            <img id="icono-tema" src="assets/img/tema-oscuro.png" alt="">
        </button>
    </div>
</header>

<div class="contenedor-principal">
    <aside id="reservado" class="reservado"></aside>

    <main>
        <section id="seccion-actual">
            <h2>Estado actual</h2>
            <div id="tarjetas" class="tarjetas"></div>
        </section>

        <!-- En pantallas grandes, app.js mueve este bloque a #reservado (columna
             izquierda) y lo deja siempre abierto; en pantallas normales se queda
             aqui como desplegable colapsado. -->
        <details id="bloque-sensores">
            <summary>Ver todos los sensores</summary>
            <table>
                <thead>
                    <tr><th>Componente</th><th>Sensor</th><th>Temperatura</th><th>Estado</th><th>Medido en</th></tr>
                </thead>
                <tbody id="tabla-sensores"></tbody>
            </table>
        </details>

        <!-- Ficha tecnica de hardware (chasis, CPU/GPU, RAM+DIMMs, discos, RAID).
             Solo informativo -- no afecta el semaforo. En pantallas grandes,
             app.js la mueve a #reservado junto con #bloque-sensores. -->
        <section id="bloque-hardware">
            <h2>Hardware</h2>
            <div id="hardware-contenido"></div>
        </section>

        <section id="seccion-historico">
            <h2>Histórico</h2>
            <div class="historico__controles" id="chips-agrupacion">
                <div class="historico__chips">
                    <button class="chip" data-agrupacion="hora" aria-pressed="true">Por hora</button>
                    <button class="chip" data-agrupacion="dia" aria-pressed="false">Por día</button>
                    <button class="chip" data-agrupacion="mes" aria-pressed="false">Por mes</button>
                </div>
                <button id="boton-actualizar" class="boton-actualizar" title="Descargar lecturas nuevas de los servidores">
                    <span class="boton-actualizar__icono">↻</span> Actualizar
                </button>
            </div>
            <div class="grafica-contenedor">
                <div class="grafica-contenedor__barra">
                    <div id="leyenda" class="leyenda"></div>
                    <div id="rango-actual" class="rango-actual"></div>
                </div>
                <svg id="grafica" width="100%" height="320" role="img" aria-label="Gráfica de temperatura en el tiempo"></svg>
                <div class="desplazador" id="desplazador" title="Arrastra para ver periodos anteriores">
                    <div class="desplazador__miniatura" id="desplazador-miniatura"></div>
                </div>
            </div>
        </section>

        <!-- Uso de disco por punto de montaje (ultimo valor, no historico).
             Se omite sola si el servidor no tiene datos todavia. -->
        <section id="seccion-disco">
            <h2>Uso de disco</h2>
            <div id="disco-contenido"></div>
            <div id="disco-slider-contenedor" class="disco-slider" hidden>
                <div class="disco-slider__fechas">
                    <span id="disco-fecha-inicio"></span>
                    <span id="disco-fecha-actual"></span>
                    <span id="disco-fecha-fin"></span>
                </div>
                <input type="range" id="disco-slider" min="0" max="0" value="0" step="1">
                <div class="disco-slider__ayuda">Arrastra para ver el uso de disco en otra fecha (usa la misma agrupación de arriba: por hora/día/mes)</div>
            </div>
        </section>
    </main>

    <aside id="arbol-servidores" class="arbol" aria-label="Servidores">
        <p class="mensaje-vacio">Cargando servidores...</p>
    </aside>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
