[ingesta]
# Cuantos servidores online se procesan en paralelo
max_workers = 5

# Carpeta local donde el usuario deja manualmente los archivos offline,
# organizados en subcarpetas por nombre de servidor (debe coincidir con
# el 'nombre' del servidor en inventario_servidores.yaml).
# Ej: ingesta/pendientes_offline/DEVELOP/lecturas_20261001_140000.csv
directorio_offline = pendientes_offline
