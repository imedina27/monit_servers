[relay]
# Intervalo propio del relay, independiente del intervalo del colector local
# (no hay urgencia de tener el dato de los companeros al segundo, solo que
# este listo cuando alguien -- central o un humano -- venga a buscarlo).
intervalo_minutos = 120

[almacenamiento]
# Carpeta donde se guardan los archivos recolectados de cada companero, en
# subcarpetas por nombre (misma convencion que ingesta/pendientes_offline/).
directorio_entrante = relay_entrante
