# Postgres + backend/dashboard/ingesta + Ofelia (scheduler de la ingesta periodica, ver abajo).
#
# Variables (${DB_NAME}, etc.) se toman de docker/.env -- copiar docker/.env.example y
# completar antes de levantar esto (docker compose las carga solo porque vive junto a este
# archivo).

services:
  postgres:
    image: postgres:18
    container_name: monit-servers-v2-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # postgres:18+ exige montar en /var/lib/postgresql directo (ya no /var/lib/postgresql/data
      # como en 16) -- cambia a su propio layout tipo pg_ctlcluster, con subcarpeta por version
      # mayor. Montar en la ruta vieja hace que el contenedor aborte con un error claro al iniciar.
      - pgdata:/var/lib/postgresql
      # Solo se aplica la primera vez que el volumen "pgdata" se crea vacio.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - quantum-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "1m"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: monit-servers-v2-backend
    # uid:gid del dueno real de los archivos montados (inventario_servidores.yaml, etc.) en este
    # host -- definir HOST_UID/HOST_GID en docker/.env si no es 1000 (el de "quantum"). Si no
    # coincide exacto con el dueno real, el contenedor no puede leer esos archivos (permission
    # denied), aunque el build haya salido bien.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Ofelia (abajo) lee estas labels para disparar la ingesta sola, cada hora en punto -- sin
    # tocar el systemd del host (decision del paso 13 del ROADMAP). "curl" ya viene en la imagen
    # (ver Dockerfile). "-sf" calla la salida normal y hace que un 4xx/5xx cuente como fallo para
    # que quede marcado como tal en los logs de Ofelia.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.ingesta.schedule: "0 0 * * * *"
      ofelia.job-exec.ingesta.command: "curl -sf -X POST http://localhost:8000/api/ingesta/ejecutar"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      # Loopback-only por defecto (igual que backend/config.ini). Definir BIND_IP en docker/.env
      # con una IP real del host (ej. la de ZeroTier) para que el dashboard sea alcanzable por el
      # resto del equipo -- mismo criterio que BIND_EXTRA_IPS en las convenciones de Quantum
      # (ver docker/CONVENCIONES_QUANTUM.md): nunca 0.0.0.0, siempre una IP literal conocida.
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ../inventario_servidores.yaml:/opt/quantumlabs/monit-servers-v2/inventario_servidores.yaml:ro
      - ../ingesta/pendientes_offline:/opt/quantumlabs/monit-servers-v2/ingesta/pendientes_offline
    # Fase 4 (opcional) del plan de prueba: permite que el contenedor llegue al host de la VM
    # (donde corre el tunel SSH hacia los servidores reales via ZeroTier) por este nombre.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks:
      - quantum-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "1m"

  # Dispara jobs dentro de otros contenedores por horario, leyendo las labels "ofelia.*" de ellos
  # -- nada de systemd/cron en el host (DEVELOP es compartido con ~23 contenedores de otros
  # productos). Necesita el socket de Docker para poder hacer "docker exec" en el contenedor
  # objetivo; montado ":ro" como higiene minima (no evita operaciones via la API, solo que se
  # reemplace/borre el archivo del socket).
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: monit-servers-v2-ofelia
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
    networks:
      - quantum-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "1m"

networks:
  quantum-network:
    driver: bridge

volumes:
  pgdata:
