# Metadatos de hardware (modelo de CPU/GPU, numero de nucleos) por servidor.
# Uso: solo mostrar informacion en el dashboard (tarjetas de "Estado actual").
# No afecta el calculo del semaforo -- eso vive en umbrales.yaml.
#
# Cualquier campo es opcional. Si un servidor no aparece aqui, o le falta
# algun campo, el dashboard cae de vuelta al nombre crudo del sensor para
# esa tarjeta puntual (comportamiento de siempre).
#
# Identificado via SSH (lscpu / nvidia-smi) el 2026-10-05 contra los
# servidores entonces alcanzables -- ver memoria del proyecto
# (hardware_servidores.md) para el detalle de como se obtuvo.

