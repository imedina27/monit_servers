# Umbrales de temperatura para el semaforo (verde/ambar/rojo) del widget.
#
# verde: temperatura_c <= verde_max
# ambar: verde_max < temperatura_c <= ambar_max
# rojo:  temperatura_c > ambar_max
#
# 'default' aplica a cualquier servidor que no tenga su propio bloque en
# 'por_servidor'. Se usa para hardware sin identificar o sin dato termico
# publico (ver caso MINI_LENOVO abajo).
#
# 'por_servidor' se identifico via SSH (lscpu / nvidia-smi) el 2026-10-05,
# contra los servidores entonces alcanzables (ver ROADMAP.md / conversacion).
# Cada bloque indica el hardware real y si el limite viene de hoja de datos
# oficial o es estimado por convencion de generacion (sin spec oficial por
# SKU, ya que ni Intel ni AMD/NVIDIA publican Tjmax exacto para todos sus
# modelos). Pendiente: validar los estimados con mediciones reales una vez
# que haya datos de operacion.

default:
  cpu:
    verde_max: 70
    ambar_max: 85
  gpu:
    verde_max: 75
    ambar_max: 85

por_servidor:

  # Intel Xeon E5-2630 v4 (Broadwell-EP) -- Tcase_max OFICIAL = 74C (Intel ARK).
  # GPU: 2x NVIDIA GeForce GTX 1080 Ti -- Max GPU Temp OFICIAL = 91C (NVIDIA).
  DEVELOP:
    cpu:
      verde_max: 60
      ambar_max: 74
    gpu:
      verde_max: 75
      ambar_max: 91

  # Intel Xeon E-2278G (Coffee Lake) -- Tjmax OFICIAL = 100C, Tcase = 73C (Intel ARK).
  # Sin GPU.
  apiman-fase1:
    cpu:
      verde_max: 70
      ambar_max: 85

  # AMD EPYC 7413 "Milan" -- sin Tjmax oficial publicado por SKU; 85C es
  # ESTIMADO por convencion de generacion Zen3 server, no confirmado.
  # OJO: hay un bug conocido del driver k10temp en kernel Linux < 6.4 que
  # reporta temperaturas falsas (~117C en idle) en EPYC Milan -- revisar
  # version de kernel en estos dos antes de confiar en la lectura cruda.
  # GPU: NVIDIA A100-PCIE-40GB -- 83C es cifra ampliamente citada (no se
  # confirmo en el datasheet oficial de NVIDIA en esta revision).
  apiman-fase2:
    cpu:
      verde_max: 65
      ambar_max: 85
    gpu:
      verde_max: 70
      ambar_max: 83
  apiman-fase3:
    cpu:
      verde_max: 65
      ambar_max: 85
    gpu:
      verde_max: 70
      ambar_max: 83

  # Intel Xeon Silver 4509Y (Sapphire Rapids) -- Tcase OFICIAL = 84C (Intel ARK).
  # Sin GPU.
  quantumdata:
    cpu:
      verde_max: 70
      ambar_max: 84

  # Intel Xeon Gold 5218 (Cascade Lake) -- Tcase OFICIAL = 87C (Intel ARK).
  # GPU: NVIDIA Tesla T4 -- GPU Max Operating Temp OFICIAL = 85C (NVIDIA datasheet).
  colima00:
    cpu:
      verde_max: 70
      ambar_max: 87
    gpu:
      verde_max: 70
      ambar_max: 85

  # AMD EPYC 9254 "Genoa" -- sin Tjmax oficial publicado por SKU; 90C es
  # ESTIMADO por convencion de generacion Zen4 server, no confirmado.
  # GPU: NVIDIA L4 -- 85C es ESTIMADO (misma clase que T4); NVIDIA solo
  # publica temperatura ambiente (0-50C), no el limite del chip.
  # colima01: nvidia-smi fallaba el 2026-10-05 (driver caido) -- la GPU
  # existe (confirmado por XClarity), pero hoy mismo no reporta temperatura.
  colima01:
    cpu:
      verde_max: 70
      ambar_max: 90
    gpu:
      verde_max: 70
      ambar_max: 85
  colima02:
    cpu:
      verde_max: 70
      ambar_max: 90
    gpu:
      verde_max: 70
      ambar_max: 85

  # NVIDIA GB10 (Grace-Blackwell superchip, CPU ARM Cortex-X925/A725 + GPU
  # integrada en el mismo paquete) -- sin spec termica publica disponible,
  # producto muy nuevo. Queda en 'default' hasta encontrar dato confiable.

  # Intel Core i7-7700HQ (Kaby Lake movil) -- Tjmax OFICIAL = 100C (Intel ARK).
  # GPU: NVIDIA GeForce GTX 1060 -- Max GPU Temp OFICIAL = 94C (NVIDIA).
  # Es hardware de laptop/estacion de trabajo, no servidor rack -- vale la
  # pena revisar si esto es intencional para el sitio TAD_18_de_Marzo (PEMEX).
  TAD_18_de_Marzo:
    cpu:
      verde_max: 70
      ambar_max: 85
    gpu:
      verde_max: 75
      ambar_max: 94
